<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Planning Opérationnel</title>
    <style>
        /* Style minimal requis pour la démonstration */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 20px; border-radius: 8px; max-width: 500px; width: 100%; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; margin-bottom: 4px; font-weight: bold; }
        .days-checkboxes { display: flex; gap: 8px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <!-- Structure du Modal d'Affectation de Tâche -->
    <div id="assignTaskModal" class="modal">
        <div class="modal-content">
            <h3>Affecter une tâche à l'agent</h3>
            <form id="assignTaskForm">
                <input type="hidden" id="assignAgentId">
                <input type="hidden" id="assignTeamId">

                <div class="form-group">
                    <label for="assignTaskCode">Tâche à affecter :</label>
                    <select id="assignTaskCode" class="form-control" required></select>
                </div>

                <div class="form-group">
                    <label>Mode d'affectation :</label>
                    <div>
                        <label><input type="radio" name="recurrenceType" value="none" checked onchange="toggleRecurrenceOptions()"> Sans récurrence (Début -> Fin)</label><br>
                        <label><input type="radio" name="recurrenceType" value="weekly" onchange="toggleRecurrenceOptions()"> Avec récurrence hebdomadaire</label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="assignStartDate">Date de début :</label>
                    <input type="date" id="assignStartDate" required>
                </div>

                <div class="form-group">
                    <label for="assignEndDate">Date de fin :</label>
                    <input type="date" id="assignEndDate" required>
                </div>

                <!-- Section spécifique à la récurrence (masquée par défaut) -->
                <div id="recurrenceOptionsSection" style="display: none; border-top: 1px solid #ccc; padding-top: 10px; margin-top: 10px;">
                    <div class="form-group">
                        <label for="assignRepeatWeeks">Répéter toutes les :</label>
                        <select id="assignRepeatWeeks">
                            <option value="1">1 semaine</option>
                            <option value="2">2 semaines</option>
                            <option value="3">3 semaines</option>
                            <option value="4">4 semaines</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Jours d'application :</label>
                        <div class="days-checkboxes">
                            <label><input type="checkbox" class="assign-day" value="1"> Lun</label>
                            <label><input type="checkbox" class="assign-day" value="2"> Mar</label>
                            <label><input type="checkbox" class="assign-day" value="3"> Mer</label>
                            <label><input type="checkbox" class="assign-day" value="4"> Jeu</label>
                            <label><input type="checkbox" class="assign-day" value="5"> Ven</label>
                            <label><input type="checkbox" class="assign-day" value="6"> Sam</label>
                            <label><input type="checkbox" class="assign-day" value="0"> Dim</label>
                        </div>
                    </div>
                </div>

                <div style="text-align: right; margin-top: 15px;">
                    <button type="button" onclick="closeAssignTaskModal()">Annuler</button>
                    <button type="button" onclick="saveAgentTask()">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Section Impression -->
    <div id="printSection"></div>

    <script>
        // Variables globales fictives pour assurer le fonctionnement du script
        let TASKS = {
            'R': { label: 'Repos', color: '#cccccc', text: '#000000', shift: '', start: '', end: '', isRest: true },
            'T1': { label: 'Tâche 1', color: '#4caf50', text: '#ffffff', shift: '', start: '', end: '', isRest: false }
        };
        let teams = [];
        let teamSchedules = {};
        let settings = { thresholds: { M: {}, A: {}, N: {} } };
        let minYearAvailable = 2024, maxYearAvailable = 2026, currentYear = 2026;

        function init() {
            // Initialisation basique
        }

        function formatDate(d) {
            return d.toISOString().split('T')[0];
        }

        function getEffectiveAgentTask(agent, teamId, dateStr) {
            if (agent.customTasks && agent.customTasks[dateStr]) {
                return agent.customTasks[dateStr];
            }
            return teamSchedules[teamId] ? (teamSchedules[teamId][dateStr] || 'R') : 'R';
        }

        /* --- FONCTIONS DU MODAL DE TÂCHE AVEC SANS RÉCURRENCE --- */
        function toggleRecurrenceOptions() {
            const isNoRecurrence = document.querySelector('input[name="recurrenceType"]:checked').value === 'none';
            const recurrenceSection = document.getElementById('recurrenceOptionsSection');
            
            if (isNoRecurrence) {
                recurrenceSection.style.display = 'none';
            } else {
                recurrenceSection.style.display = 'block';
            }
        }

        function openAssignTaskModal(agentId, teamId) {
            document.getElementById('assignAgentId').value = agentId;
            document.getElementById('assignTeamId').value = teamId;

            // Remplir les tâches
            const select = document.getElementById('assignTaskCode');
            select.innerHTML = '';
            Object.keys(TASKS).forEach(code => {
                const opt = document.createElement('option');
                opt.value = code;
                opt.textContent = `${code} - ${TASKS[code].label}`;
                select.appendChild(opt);
            });

            // Par défaut : Sans récurrence coché
            document.querySelector('input[name="recurrenceType"][value="none"]').checked = true;
            toggleRecurrenceOptions();

            // Dates par défaut (Aujourd'hui)
            const todayStr = formatDate(new Date());
            document.getElementById('assignStartDate').value = todayStr;
            document.getElementById('assignEndDate').value = todayStr;

            // Décocher les jours
            document.querySelectorAll('.assign-day').forEach(cb => cb.checked = false);

            document.getElementById('assignTaskModal').style.display = 'flex';
        }

        function closeAssignTaskModal() {
            document.getElementById('assignTaskModal').style.display = 'none';
        }

        function saveAgentTask() {
            const agentId = document.getElementById('assignAgentId').value;
            const teamId = document.getElementById('assignTeamId').value;
            const taskCode = document.getElementById('assignTaskCode').value;
            const recurrenceType = document.querySelector('input[name="recurrenceType"]:checked').value;
            
            const startDateStr = document.getElementById('assignStartDate').value;
            const endDateStr = document.getElementById('assignEndDate').value;

            if (!startDateStr || !endDateStr) {
                alert("Veuillez sélectionner une date de début et de fin.");
                return;
            }

            const startDate = new Date(startDateStr);
            const endDate = new Date(endDateStr);

            if (startDate > endDate) {
                alert("La date de début doit être antérieure ou égale à la date de fin.");
                return;
            }

            // Recherche de l'agent dans la structure
            let targetAgent = null;
            teams.forEach(t => {
                if (t.id === teamId) {
                    const ag = t.agents.find(a => a.id === agentId);
                    if (ag) targetAgent = ag;
                }
            });

            if (!targetAgent) targetAgent = { customTasks: {} }; // Fallback de sécurité
            if (!targetAgent.customTasks) targetAgent.customTasks = {};

            if (recurrenceType === 'none') {
                // Application continue entre la date de début et la date de fin (sans saut de récurrence)
                let curr = new Date(startDate);
                while (curr <= endDate) {
                    const dStr = formatDate(curr);
                    targetAgent.customTasks[dStr] = taskCode;
                    curr.setDate(curr.getDate() + 1);
                }
            } else {
                // Application avec récurrence hebdomadaire
                const repeatWeeks = parseInt(document.getElementById('assignRepeatWeeks').value, 10);
                const selectedDays = Array.from(document.querySelectorAll('.assign-day:checked')).map(cb => parseInt(cb.value, 10));

                if (selectedDays.length === 0) {
                    alert("Veuillez sélectionner au moins un jour de la semaine pour la récurrence.");
                    return;
                }

                let curr = new Date(startDate);
                while (curr <= endDate) {
                    const dayOfWeek = curr.getDay(); // 0 (Dim) à 6 (Sam)
                    if (selectedDays.includes(dayOfWeek)) {
                        const dStr = formatDate(curr);
                        targetAgent.customTasks[dStr] = taskCode;
                    }
                    
                    // Avancer d'un jour
                    curr.setDate(curr.getDate() + 1);
                    
                    // Gestion du saut de semaines si besoin
                    if (repeatWeeks > 1 && curr.getDay() === 1 && curr > startDate) {
                        curr.setDate(curr.getDate() + (7 * (repeatWeeks - 1)));
                    }
                }
            }

            closeAssignTaskModal();
            if (typeof renderAll === 'function') renderAll(true);
        }

        /* --- FONCTION D'ENREGISTREMENT DES PARAMÈTRES ET FENÊTRE CONFIG --- */
        function saveSettings() {
            const taskRows = document.querySelectorAll('.task-row');
            const newTasks = {};
            
            taskRows.forEach(row => {
                const code = row.querySelector('.task-code').value.trim().toUpperCase(); 
                const label = row.querySelector('.task-label').value.trim(); 
                const shift = row.querySelector('.task-shift').value;
                const start = row.querySelector('.task-start').value; 
                const end = row.querySelector('.task-end').value; 
                const isRest = row.querySelector('.task-rest').checked;
                const color = row.querySelector('.task-bg').value; 
                const text = row.querySelector('.task-txt').value;
                if (code) newTasks[code] = { label, color, text, shift, start, end, isRest };
            });
            if (Object.keys(newTasks).length > 0) TASKS = newTasks;

            settings.thresholds.M.orange = parseInt(document.getElementById('th_M_orange').value, 10); 
            settings.thresholds.M.green = parseInt(document.getElementById('th_M_green').value, 10);
            settings.thresholds.A.orange = parseInt(document.getElementById('th_A_orange').value, 10); 
            settings.thresholds.A.green = parseInt(document.getElementById('th_A_green').value, 10);
            settings.thresholds.N.orange = parseInt(document.getElementById('th_N_orange').value, 10); 
            settings.thresholds.N.green = parseInt(document.getElementById('th_N_green').value, 10);
            
            closeSettings(); 
            if (typeof renderAll === 'function') renderAll(true);
        }

        function closeSettings() {
            // Logique de fermeture des paramètres
        }

        /* --- FONCTIONS D'IMPRESSION DU PLANNING AU MOIS --- */
        function openPrintModal() {
            const printYearSelect = document.getElementById('printYear');
            printYearSelect.innerHTML = '';
            for (let y = minYearAvailable; y <= maxYearAvailable; y++) {
                const opt = document.createElement('option');
                opt.value = y;
                opt.innerText = y;
                if (y === currentYear) opt.selected = true;
                printYearSelect.appendChild(opt);
            }
            document.getElementById('printMonth').value = new Date().getMonth();
            document.getElementById('printModal').style.display = 'flex';
        }

        function closePrintModal() {
            document.getElementById('printModal').style.display = 'none';
        }

        function generateAndPrintMonth() {
            const selectedMonth = parseInt(document.getElementById('printMonth').value, 10);
            const selectedYear = parseInt(document.getElementById('printYear').value, 10);

            const daysInMonth = new Date(selectedYear, selectedMonth + 1, 0).getDate();
            const monthDates = [];
            for (let day = 1; day <= daysInMonth; day++) {
                monthDates.push(new Date(selectedYear, selectedMonth, day));
            }

            const monthNames = ["Janvier", "Février", "Mars", "Avril", "Mai", "Juin", "Juillet", "Août", "Septembre", "Octobre", "Novembre", "Décembre"];
            
            let html = `
                <div style="padding: 10px;">
                    <h2 style="text-align:center; margin-bottom: 10px;">Planning Opérationnel — ${monthNames[selectedMonth]} ${selectedYear}</h2>
                    <table>
                        <thead>
                            <tr>
                                <th>Équipe / Agent</th>
                                <th>Compétences</th>
            `;

            monthDates.forEach(d => {
                const dayName = d.toLocaleDateString('fr-FR', { weekday: 'short' });
                const dayNum = String(d.getDate()).padStart(2, '0');
                html += `<th>${dayName}<br>${dayNum}</th>`;
            });

            html += `</tr></thead><tbody>`;

            teams.forEach(team => {
                html += `<tr style="background-color: #eee; font-weight: bold;">`;
                html += `<td style="text-align: left;">${team.name}</td><td>Roulement</td>`;
                monthDates.forEach(d => {
                    const dStr = formatDate(d);
                    const taskCode = teamSchedules[team.id] ? (teamSchedules[team.id][dStr] || 'R') : 'R';
                    const task = TASKS[taskCode] || TASKS['R'];
                    html += `<td style="background-color: ${task.color} !important; color: ${task.text} !important; font-weight: bold;">${taskCode}</td>`;
                });
                html += `</tr>`;

                team.agents.forEach(agent => {
                    html += `<tr>`;
                    html += `<td style="text-align: left; padding-left: 10px;">${agent.name}</td>`;
                    
                    let skillNames = (agent.skills || []).map(sId => {
                        const def = skillDefinitions.find(s => s.id === sId);
                        return def ? def.name : sId;
                    }).join(', ');
                    
                    html += `<td style="font-size: 6pt;">${skillNames || '-'}</td>`;

                    monthDates.forEach(d => {
                        const dStr = formatDate(d);
                        const taskCode = getEffectiveAgentTask(agent, team.id, dStr);
                        const task = TASKS[taskCode] || TASKS['R'];
                        html += `<td style="background-color: ${task.color} !important; color: ${task.text} !important; font-weight: bold;">${taskCode}</td>`;
                    });
                    html += `</tr>`;
                });
            });

            html += `</tbody></table></div>`;

            document.getElementById('printSection').innerHTML = html;
            closePrintModal();
            window.print();
        }

        window.onload = init;
    </script>
</body>
</html>
