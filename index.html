<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrice de Planning</title>
  <!-- Firebase App & Realtime Database SDKs -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      background-color: #f4f6f9;
      color: #333;
    }
    h1 {
      text-align: center;
      color: #2c3e50;
    }
    .status-bar {
      text-align: center;
      padding: 8px;
      margin-bottom: 15px;
      border-radius: 4px;
      font-weight: bold;
    }
    .status-online { background-color: #d4edda; color: #155724; }
    .status-offline { background-color: #f8d7da; color: #721c24; }
    
    .team-card {
      background: white;
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }
    .team-title {
      font-size: 1.2em;
      font-weight: bold;
      color: #007bff;
      border-bottom: 2px solid #e9ecef;
      padding-bottom: 5px;
      margin-bottom: 10px;
    }
    .agent-row {
      display: flex;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid #f1f1f1;
    }
    .agent-row:last-child {
      border-bottom: none;
    }
    .agent-name {
      width: 200px;
      font-weight: 500;
    }
    .skills-container {
      display: flex;
      gap: 15px;
    }
    .skill-label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 0.9em;
      background: #f8f9fa;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #ced4da;
    }
    .skill-label:hover {
      background: #e2e6ea;
    }
  </style>
</head>
<body>

  <h1>Gestion de la Matrice d'Équipe</h1>
  <div id="status" class="status-bar status-offline">Connexion à Firebase en cours...</div>
  
  <div id="matrixContainer"></div>

  <script>
    // ----------------------------------------------------
    // 1. CONFIGURATION ET INITIALISATION FIREBASE
    // ----------------------------------------------------
    const firebaseConfig = {
      apiKey: "VOTRE_API_KEY",
      authDomain: "VOTRE_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://VOTRE_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "VOTRE_PROJECT_ID",
      storageBucket: "VOTRE_PROJECT_ID.appspot.com",
      messagingSenderId: "VOTRE_SENDER_ID",
      appId: "VOTRE_APP_ID"
    };

    // Initialisation
    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();
    const planningRef = db.ref('planning-ps');

    // Liste des compétences disponibles
    const AVAILABLE_SKILLS = ["Caisse", "Accueil", "Stock", "Encadrement"];

    // Structure de secours par défaut (6 équipes de 7 agents)
    const defaultTeams = Array.from({ length: 6 }, (_, tIndex) => ({
      id: `team_${tIndex + 1}`,
      name: `Équipe ${tIndex + 1}`,
      members: Array.from({ length: 7 }, (_, aIndex) => ({
        id: `agent_${tIndex + 1}_${aIndex + 1}`,
        name: `Agent ${tIndex + 1}.${aIndex + 1}`,
        skills: [] // Tableau initialement vide
      }))
    }));

    let teams = [...defaultTeams];

    // ----------------------------------------------------
    // 2. SYNCHRONISATION FIREBASE EN TEMPS RÉEL
    // ----------------------------------------------------
    planningRef.on('value', (snapshot) => {
      const data = snapshot.val();
      const statusEl = document.getElementById('status');
      
      statusEl.textContent = "Connecté à Firebase (Synchro temps réel)";
      statusEl.className = "status-bar status-online";

      if (data) {
        loadAppState(data);
      } else {
        // Si la base est totalement vide, on initialise avec la structure par défaut
        saveAppState();
        renderMatrix();
      }
    }, (error) => {
      console.error("Erreur de lecture Firebase :", error);
      const statusEl = document.getElementById('status');
      statusEl.textContent = "Erreur de connexion Firebase";
      statusEl.className = "status-bar status-offline";
    });

    // ----------------------------------------------------
    // 3. CHARGEMENT ET SÉCURISATION DES DONNÉES (CORRECTIF)
    // ----------------------------------------------------
    function loadAppState(data) {
      if (!data || !data.teams) {
        renderMatrix();
        return;
      }

      // Reconstitution propre et sécurisée des équipes
      teams = defaultTeams.map(defTeam => {
        const loadedTeam = Array.isArray(data.teams) 
          ? data.teams.find(t => t && t.id === defTeam.id)
          : data.teams[defTeam.id];

        if (!loadedTeam) return defTeam;

        // Sécurisation des membres et de leurs compétences
        const members = defTeam.members.map(defAgent => {
          let loadedAgent = null;
          if (loadedTeam.members) {
            loadedAgent = Array.isArray(loadedTeam.members)
              ? loadedTeam.members.find(a => a && a.id === defAgent.id)
              : loadedTeam.members[defAgent.id];
          }

          if (!loadedAgent) return defAgent;

          return {
            ...loadedAgent,
            // SÉCURITÉ CLEF : Si toutes les compétences ont été décochées, 
            // Firebase a supprimé le champ. On réinjecte un tableau vide [].
            skills: Array.isArray(loadedAgent.skills) ? loadedAgent.skills : []
          };
        });

        return {
          ...loadedTeam,
          members: members
        };
      });

      renderMatrix();
    }

    // Sauvegarde de l'état actuel dans Firebase
    function saveAppState() {
      planningRef.set({
        teams: teams,
        lastUpdated: new Date().toISOString()
      }).catch(err => console.error("Erreur de sauvegarde :", err));
    }

    // ----------------------------------------------------
    // 4. ACTION : BASCULEMENT D'UNE COMPÉTENCE (CORRECTIF)
    // ----------------------------------------------------
    function toggleSkill(agentId, skillName) {
      // Recherche de l'agent dans la structure
      for (let team of teams) {
        const agent = team.members.find(m => m && m.id === agentId);
        if (agent) {
          // Sécurité : S'assurer que agent.skills est bien un tableau
          if (!Array.isArray(agent.skills)) {
            agent.skills = [];
          }

          const index = agent.skills.indexOf(skillName);
          if (index > -1) {
            // Retirer la compétence
            agent.skills.splice(index, 1);
          } else {
            // Ajouter la compétence
            agent.skills.push(skillName);
          }

          // SÉCURITÉ CLEF : S'assurer qu'il reste un tableau (même vide)
          if (!agent.skills) {
            agent.skills = [];
          }

          // Mise à jour locale immédiate et envoi Firebase
          renderMatrix();
          saveAppState();
          break;
        }
      }
    }

    // ----------------------------------------------------
    // 5. AFFICHAGE DE LA MATRICE (CORRECTIF)
    // ----------------------------------------------------
    function renderMatrix() {
      const container = document.getElementById('matrixContainer');
      if (!container) return;

      let html = '';

      teams.forEach(team => {
        if (!team) return;

        html += `<div class="team-card">`;
        html += `<div class="team-title">${team.name || 'Équipe sans nom'}</div>`;

        const members = team.members || [];
        members.forEach(agent => {
          if (!agent) return;

          // SÉCURITÉ CLEF : Protection contre les compétences undefined/null
          const agentSkills = Array.isArray(agent.skills) ? agent.skills : [];

          html += `
            <div class="agent-row">
              <div class="agent-name">${agent.name || 'Agent'}</div>
              <div class="skills-container">
          `;

          AVAILABLE_SKILLS.forEach(skill => {
            const isChecked = agentSkills.includes(skill) ? 'checked' : '';
            html += `
              <label class="skill-label">
                <input 
                  type="checkbox" 
                  ${isChecked} 
                  onchange="toggleSkill('${agent.id}', '${skill}')"
                />
                ${skill}
              </label>
            `;
          });

          html += `
              </div>
            </div>
          `;
        });

        html += `</div>`;
      });

      container.innerHTML = html;
    }

    // Rendu initial avant chargement des données Firebase
    renderMatrix();
  </script>
</body>
</html>
